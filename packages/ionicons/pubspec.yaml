name: ionicons
description: Ionicons glyphs, patched for current Flutter SDKs.
version: 0.2.2
publish_to: none

environment:
  sdk: ^3.7.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: Ionicons
      fonts:
        - asset: assets/fonts/Ionicons.ttf
